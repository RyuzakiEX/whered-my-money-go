<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Where'd My Money Go</title>
  <!-- Money green, the income token (oklch 0.52 0.14 150). A solid tile so
       the mark reads on light and dark browser tabs alike. -->
  <rect width="64" height="64" rx="14" fill="#1F8A4C"/>

  <!-- The wallet, open at the top, left behind. -->
  <path d="M8 32 H38 a5 5 0 0 1 5 5 V50 a5 5 0 0 1 -5 5 H13 a5 5 0 0 1 -5 -5 Z"
        fill="#FFF8E7"/>
  <path d="M8 32 L31 26.5 L34 32 Z" fill="#E6DAC0"/>
  <rect x="33" y="39.5" width="12.5" height="9" rx="4.5" fill="#1F8A4C"/>
  <circle cx="38" cy="44" r="2" fill="#FFF8E7"/>

  <!-- The answer to "where'd it go": the peso, sprouting a wing and leaving. -->
  <path d="M38.5 19 C 34 12.5, 27.5 10, 21 11.5 C 24 13, 25.5 14.2, 26.2 15.4
           C 23.2 15.4, 20.8 16.6, 19.6 18.6 C 22.8 18.4, 25 18.8, 26.4 19.6
           C 24.6 20.6, 23.6 22.2, 23.6 24 C 28.5 21.8, 33.5 21.6, 38.5 22.2 Z"
        fill="#FFF8E7"/>
  <circle cx="45" cy="18" r="9.5" fill="#FFC53D" stroke="#B26A00" stroke-width="2.2"/>
  <path d="M43 13 V23 M43 13 H46.4 a2.9 2.9 0 0 1 0 5.8 H43 M40.8 15.8 H48.6 M40.8 18.6 H48.6"
        fill="none" stroke="#B26A00" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
