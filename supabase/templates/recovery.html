<h2>Reset your password</h2>
<p>
  Someone (hopefully you) asked to reset the password for your Where'd My Money
  Go account.
</p>
<p>
  <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery"
    >Choose a new password</a
  >
</p>
<p>
  The link works once, within an hour, on any device. If you didn't ask for
  this, you can ignore this email: your password stays the same.
</p>
