- name: "area:budgets"
  color: "BFDADC"
  description: "Budgets, progress, forecasting"

- name: "area:goals"
  color: "BFDADC"
  description: "Savings goals and contributions"

- name: "area:timeline"
  color: "BFDADC"
  description: "Money Timeline and recurrence"

- name: "area:sts"
  color: "BFDADC"
  description: "Safe to Spend"

- name: "area:dashboard"
  color: "BFDADC"
  description: "Dashboard tiles, charts, widgets"

- name: "area:reports"
