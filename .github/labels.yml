# ---------------------------------------------------------------------------
# status — workflow state not covered by the project board
# ---------------------------------------------------------------------------
- name: "status:blocked"
  color: "000000"
  description: "Waiting on a dependency"

- name: "status:ready"
  color: "0E8A16"
  description: "Meets the Definition of Ready — safe to pick up"

- name: "status:needs-info"
  color: "FBCA04"
  description: "Under-specified — cannot start"

- name: "good-first-task"
  color: "7057FF"
  description: "Small and self-contained"
