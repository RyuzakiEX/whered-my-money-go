# Main quality pipeline: lint, commit messages, typecheck, unit, integration,
# build. Every job runs unconditionally and in parallel (M0-B08); there is no
# "detect, then skip" any more — a gate that did not run must never read as a
# gate that passed. See workflow/08-ci-gates.md.
#
# Branch protection requires the `ci` job (the aggregate gate), not the
# individual jobs, so adding or renaming a job does not need a settings change.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deliberately NOT path-filtered. A required check with a `paths` filter never
# runs on unrelated PRs and shows as "expected — waiting for status", which
# blocks the merge button indefinitely.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: those gate deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull the local stack's images from GitHub's registry, not the CLI default
# (public.ecr.aws). Anonymous ECR pulls are quota-limited, and runners share
# egress IPs: PR #43's e2e job failed every pull with "Data limit exceeded"
# while sibling jobs passed. Workflow-level, because `db diff`, `gen types`, and
# `test db` pull images of their own too. See workflow/08-ci-gates.md.
env:
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node-project
      - run: npm run lint

      # Asserts the deliberate-violation fixtures STILL fail, each on its own
      # specific rule. A boundary rule that silently stops working — a typo in
      # a glob, a dropped config block — would otherwise go unnoticed until
      # lib/core had quietly imported React.
      - name: Assert import boundaries are enforced
        run: npm run lint:boundaries

      - name: Check formatting
        run: npm run format:check

  # The same commitlint rules as the local commit-msg hook (M0-B11). Hooks
  # can be skipped with --no-verify; this cannot, so the convention holds.
  commitlint:
    name: commit messages
    # PR-only: a push to main has no commit range of its own to check. The
    # aggregate allows this one skip, on push events only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Both ends of the PR's commit range must be present locally.
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-project

      # Merge and revert commits are skipped by commitlint's defaults, and
      # Dependabot's by commitlint.config.mjs. A human commit pushed onto a
      # Dependabot PR is still checked.
      - name: Every commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # Squash merge makes the PR title the commit on main (workflow/03-commits.md),
      # so it is the message that matters most. GitHub appends " (#N)" to it,
      # so that suffix is linted too — a 70-character title becomes a
      # 76-character header on main. Passed via env, never interpolated into
      # the script: a PR title is untrusted input.
      - name: PR title, as it will land on main
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | npx --no -- commitlint --verbose

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node-project
      - run: npm run typecheck

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node-project

      # Coverage thresholds are enforced in vitest.config.ts, not here, so
      # `npm run test` fails identically on a developer's machine.
      # lib/core carries the money math and holds a 90% floor.
      - run: npm run test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: integration tests
    # packages: read lets GITHUB_TOKEN authenticate the image pulls below.
    # Job-level permissions replace the workflow's, so contents: read is
    # restated.
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node-project

      # The CLI version is pinned once, in package.json. Local `npx supabase`
      # and CI must run the same one — config, diffs, and generated types all
      # differ between CLI versions.
      - name: Read pinned Supabase CLI version
        id: cli
        shell: bash
        run: echo "version=$(node -p "require('./package.json').devDependencies.supabase")" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        with:
          version: ${{ steps.cli.outputs.version }}

      # A throwaway local Postgres. No secrets needed, so this runs on fork
      # PRs too — see docs/ops/environments.md.
      # Authenticated pulls. Anonymous ghcr.io pulls share a per-IP rate limit
      # with every other job on the runner's egress IP, and #44's first run
      # was refused mid-pull ("retry-after … allowed: 44000/minute").
      # GITHUB_TOKEN is minted per run (read-only on fork PRs), so this adds
      # no repository secret.
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset --no-seed=false

      # The smoke test makes an authenticated round trip, so it needs the local
      # anon key. The client-factory test also creates and deletes a throwaway
      # user, which needs the service-role key. Both are the CLI's demo keys
      # for THIS throwaway stack — created by `supabase start` above, valid
      # nowhere else, and never stored as repository secrets.
      - name: Export local Supabase keys
        shell: bash
        run: |
          set -euo pipefail
          status=$(supabase status -o env)
          anon=$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' <<<"$status")
          service=$(sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p' <<<"$status")
          if [ -z "$anon" ] || [ -z "$service" ]; then
            echo "::error::Could not read ANON_KEY and SERVICE_ROLE_KEY from 'supabase status -o env'."
            exit 1
          fi
          # Demo keys, but keep them out of logs anyway: a habit worth having.
          echo "::add-mask::$service"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: npm run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  build:
    name: build
    # Independent of lint and typecheck, so it runs alongside them: the
    # aggregate still fails if any of them fails, and wall-clock time drops.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-node-project

      # Placeholder public values: the build only needs these to be present
      # and well-formed. Real values live in Vercel per environment, and no
      # secret is required to prove the app compiles.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder-not-a-secret
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # ---------------------------------------------------------------------------
  # Aggregate gate. THIS is the required status check.
  #
  # `if: always()` makes it run even when a dependency was skipped, and it
  # fails only on a real failure or cancellation. That distinction is the whole
  # point: skipped jobs must not block a PR, but failed ones must.
  # ---------------------------------------------------------------------------
  ci:
    name: ci
    needs: [lint, commitlint, typecheck, unit, integration, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The action is local, so the checkout is needed to find it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/require-results
        with:
          needs: ${{ toJSON(needs) }}
          allow-skipped: ${{ github.event_name != 'pull_request' && 'commitlint' || '' }}
          failure-hint: "See workflow/08-ci-gates.md for the local command behind each job."
