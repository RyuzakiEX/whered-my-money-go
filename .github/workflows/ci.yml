# Main quality pipeline: lint, typecheck, unit, integration, build.
#
# Every job below is gated on `preflight`, which detects what the repository
# actually contains. While this repo is docs-only, those jobs SKIP and the
# `ci` aggregate gate stays green. See workflow/08-ci-gates.md.
#
# Branch protection should require the `ci` job (the aggregate gate) and NOT
# the individual jobs — a skipped required check would otherwise leave every
# PR pending forever.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deliberately NOT path-filtered. A required check with a `paths` filter never
# runs on unrelated PRs and shows as "expected — waiting for status", which
# blocks the merge button indefinitely.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: those gate deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: preflight (detect project)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_app: ${{ steps.detect.outputs.has_app }}
      has_lockfile: ${{ steps.detect.outputs.has_lockfile }}
      has_tests: ${{ steps.detect.outputs.has_tests }}
      has_integration_tests: ${{ steps.detect.outputs.has_integration_tests }}
      has_supabase_config: ${{ steps.detect.outputs.has_supabase_config }}
      has_migrations: ${{ steps.detect.outputs.has_migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "  $1 = $2"; }

          echo "Detecting project capabilities:"

          [ -f package.json ] && out has_app true || out has_app false

          if [ -f package-lock.json ] || [ -f pnpm-lock.yaml ]; then
            out has_lockfile true
          else
            out has_lockfile false
          fi

          # `find -quit` beats `compgen -G` here: it recurses, and it does not
          # depend on globstar or nullglob shell options being set.
          if [ -n "$(find . -path ./node_modules -prune -o \
                          -name '*.test.ts' -print -o \
                          -name '*.test.tsx' -print -o \
                          -name '*.spec.ts' -print 2>/dev/null | head -n1)" ]; then
            out has_tests true
          else
            out has_tests false
          fi

          [ -d tests/integration ] && out has_integration_tests true || out has_integration_tests false
          [ -f supabase/config.toml ] && out has_supabase_config true || out has_supabase_config false

          if [ -n "$(find supabase/migrations -name '*.sql' -print 2>/dev/null | head -n1)" ]; then
            out has_migrations true
          else
            out has_migrations false
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Preflight"
            echo ""
            echo "| Signal | Value |"
            echo "|---|---|"
            echo "| App (\`package.json\`) | \`${{ steps.detect.outputs.has_app }}\` |"
            echo "| Lockfile | \`${{ steps.detect.outputs.has_lockfile }}\` |"
            echo "| Unit tests | \`${{ steps.detect.outputs.has_tests }}\` |"
            echo "| Integration tests | \`${{ steps.detect.outputs.has_integration_tests }}\` |"
            echo "| Supabase config | \`${{ steps.detect.outputs.has_supabase_config }}\` |"
            echo "| Migrations | \`${{ steps.detect.outputs.has_migrations }}\` |"
            echo ""
            if [ "${{ steps.detect.outputs.has_app }}" != "true" ]; then
              echo "> No application code yet — code jobs are skipped by design."
              echo "> See \`workflow/08-ci-gates.md\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint
    needs: preflight
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-project
      - run: npm run lint
      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: typecheck
    needs: preflight
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-project
      - run: npm run typecheck

  unit:
    name: unit tests
    needs: preflight
    if: needs.preflight.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-project

      # Coverage thresholds are enforced in vitest.config.ts, not here, so
      # `npm run test` fails identically on a developer's machine.
      # lib/core carries the money math and holds a 90% floor.
      - run: npm run test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: integration tests
    needs: preflight
    if: needs.preflight.outputs.has_supabase_config == 'true' && needs.preflight.outputs.has_integration_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-project

      # TODO(#M0-B08): replace with the real commit SHA before this job first
      # runs. Resolve with:
      #   gh api repos/supabase/setup-cli/commits/v1 --jq .sha
      # Pinning policy and rationale: docs/security/ci-security-gates.md
      - uses: supabase/setup-cli@v1 # PIN-PENDING
        with:
          version: latest

      # A throwaway local Postgres. No secrets needed, so this runs on fork
      # PRs too — see docs/ops/environments.md.
      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset --no-seed=false

      - name: Run integration tests
        run: npm run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  build:
    name: build
    needs: [preflight, lint, typecheck]
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-project

      # Placeholder public values: the build only needs these to be present
      # and well-formed. Real values live in Vercel per environment, and no
      # secret is required to prove the app compiles.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder-not-a-secret
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # ---------------------------------------------------------------------------
  # Aggregate gate. THIS is the required status check.
  #
  # `if: always()` makes it run even when a dependency was skipped, and it
  # fails only on a real failure or cancellation. That distinction is the whole
  # point: skipped jobs must not block a PR, but failed ones must.
  # ---------------------------------------------------------------------------
  ci:
    name: ci
    needs: [preflight, lint, typecheck, unit, integration, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"

          # Read results without jq's presence being load-bearing on the runner
          # image, and without letting a job name interpolate into the script.
          failed=$(printf '%s' "$NEEDS" | grep -o '"result": *"failure"' | wc -l)
          cancelled=$(printf '%s' "$NEEDS" | grep -o '"result": *"cancelled"' | wc -l)

          {
            echo "### CI aggregate gate"
            echo ""
            echo "- failures: $failed"
            echo "- cancellations: $cancelled"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ] || [ "$cancelled" -gt 0 ]; then
            echo "::error::A required CI job failed or was cancelled."
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
