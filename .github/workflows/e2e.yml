# Playwright end-to-end tests, against a production build and a CI-started
# Supabase.
#
# Separate from ci.yml because it needs a browser and a running database.
# NOT path-filtered (M0-B08): `e2e` is a required status check, and a required
# check with a `paths` filter never runs on unrelated PRs, so it shows as
# "expected — waiting for status" and blocks the merge button forever. With
# the browser cache it costs about three minutes per PR.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull the local stack's images from GitHub's registry, not the CLI default
# (public.ecr.aws). Anonymous ECR pulls are quota-limited, and runners share
# egress IPs: PR #43's e2e job failed every pull with "Data limit exceeded"
# while sibling jobs passed. Workflow-level, because `db diff`, `gen types`, and
# `test db` pull images of their own too. See workflow/08-ci-gates.md.
env:
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

jobs:
  playwright:
    name: playwright (chromium)
    # packages: read lets the start-supabase action authenticate its pulls.
    # Job-level permissions replace the workflow's, so contents: read is
    # restated.
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-node-project

      # --- Browsers, cached ---------------------------------------------------
      # Keyed on the exact @playwright/test version: a version bump needs a
      # different browser build, so it must miss the cache.
      - name: Read pinned Playwright version
        id: pw
        shell: bash
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      # Chromium only. A cross-browser matrix triples the runtime for a suite
      # whose job is to catch broken flows, not rendering differences.
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The browser binary is cached; its system libraries are not (they live
      # outside the cache path), so a cache hit still installs those.
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # --- Supabase -----------------------------------------------------------
      # Same pinned CLI as `npx supabase` locally and the ci.yml integration job.
      - name: Read pinned Supabase CLI version
        id: cli
        shell: bash
        run: echo "version=$(node -p "require('./package.json').devDependencies.supabase")" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        with:
          version: ${{ steps.cli.outputs.version }}

      - name: Start local Supabase
        uses: ./.github/actions/start-supabase

      - name: Apply migrations
        run: supabase db reset

      # The anon key of THIS throwaway stack — public, valid nowhere else.
      - name: Export local anon key
        shell: bash
        run: |
          set -euo pipefail
          anon=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')
          if [ -z "$anon" ]; then
            echo "::error::Could not read ANON_KEY from 'supabase status -o env'."
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon" >> "$GITHUB_ENV"

      # --- Run against a production build -------------------------------------
      # E2E tests what ships: build here, and playwright.config.ts starts
      # `npm run start` (not the dev server) when CI is set.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          CI: "true"

      # The HTML report is uploaded on every run; traces and screenshots
      # (test-results/) exist only when something failed or retried, and are
      # the only way to debug a CI-only failure.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

  e2e-status:
    name: e2e
    needs: [playwright]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The action is local, so the checkout is needed to find it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/require-results
        with:
          needs: ${{ toJSON(needs) }}
          failure-hint: "Download the playwright-report artifact; the trace is under test-results/."
