# Security scanning: secrets, vulnerabilities, misconfiguration, dependencies.
#
# gitleaks and Trivy run UNCONDITIONALLY — they are meaningful from the first
# commit, before any application code exists. gitleaks scans git history for
# secrets; Trivy's misconfig scanner finds problems in these very workflow
# files. The dependency jobs gate on a lockfile.
#
# Branch protection should require the `security` aggregate gate.
# See docs/security/ci-security-gates.md for triage and suppression policy.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:17 UTC. An off-peak, non-round minute — the top of the hour is
    # heavily contended on GitHub's shared runners and delays scheduled jobs.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history. A shallow clone scans only the tip commit, which
          # misses the case this gate exists for: a secret committed earlier
          # and "removed" in a later commit while staying in history.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          # GITLEAKS_LICENSE is only required for GitHub *organization*
          # accounts. Personal/public repos need none.

  trivy:
    name: trivy (vuln + secret + misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pass 1 — report everything, never fail. Feeds the Security tab so
      # findings accumulate as history even on main.
      #
      # continue-on-error because this pass produces a REPORT, not a verdict:
      # the action's own installer step downloads the Trivy binary from GitHub
      # releases and has been observed to fail transiently, which would red the
      # whole security gate over an artifact nobody is blocking on. The verdict
      # comes from the PR-gating pass below, which is not tolerant.
      - name: Scan (report)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      # Only upload if Trivy actually produced the file. The scan step can exit
      # without writing SARIF (e.g. nothing scannable yet), and a missing-path
      # error would then fail the whole security gate over a report artifact.
      - name: Check for SARIF output
        id: sarif
        if: always()
        shell: bash
        run: |
          if [ -f trivy.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No trivy.sarif produced — skipping Security tab upload."
          fi

      # Uploading requires code scanning to be enabled on the repository.
      # continue-on-error keeps a *reporting* step from failing a gate whose
      # actual verdict comes from the PR-gating scan below.
      - name: Upload SARIF
        if: always() && steps.sarif.outputs.exists == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy

      # Pass 2 — the actual gate, PRs only. Splitting the passes means a
      # newly-disclosed CVE in a dependency does not retroactively turn main
      # red, while a PR that introduces one is blocked.
      - name: Gate on HIGH/CRITICAL (pull requests)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # to post the summary comment on failure
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Requires the repository's Dependency graph to be enabled
      # (Settings → Code security). Without it the action errors outright
      # rather than no-opping, so this is continue-on-error: a gate that is
      # permanently red because of a repo setting teaches people to ignore
      # red gates, which is worse than the gate being absent.
      #
      # TODO(#M0-B12): enable Dependency graph, then remove continue-on-error
      # so this genuinely blocks again.
      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Copyleft licences are incompatible with a hosted SaaS product.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-node-project
        with:
          install: "false"

      # Production dependencies are the gate: a dev-only advisory should not
      # block a PR, since it never reaches a user's browser or our server.
      - name: Audit production dependencies (blocking)
        run: npm audit --audit-level=high --omit=dev

      # Full audit is informational — visible in the summary, never blocking.
      - name: Audit all dependencies (informational)
        continue-on-error: true
        shell: bash
        run: |
          {
            echo "### npm audit (all dependencies, informational)"
            echo ""
            echo '```text'
            npm audit 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Workflow files themselves. A workflow that fails to LOAD runs zero jobs and
  # posts no status at all, so its gates vanish instead of going red (this
  # happened in M0-B11: `hashFiles()` in a job-level `if`). This job lives in
  # security.yml, not ci.yml, so a broken ci.yml cannot take it down too.
  # The image is pinned by digest, like every action is pinned by SHA.
  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint every workflow (includes shellcheck on run blocks)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          -color

  # ---------------------------------------------------------------------------
  # Aggregate gate — the required status check for this workflow.
  # ---------------------------------------------------------------------------
  security:
    name: security
    needs: [gitleaks, trivy, dependency-review, npm-audit, actionlint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The action is local, so the checkout is needed to find it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/require-results
        with:
          needs: ${{ toJSON(needs) }}
          # dependency-review runs on pull requests only.
          allow-skipped: ${{ github.event_name != 'pull_request' && 'dependency-review' || '' }}
          failure-hint: "See docs/security/ci-security-gates.md for triage."
